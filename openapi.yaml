openapi: 3.1.0
info:
  title: Helserefusjon – åpne data
  version: "1"
  summary: Åpne data fra Helserefusjonsområdet (Helfo).
  description: |
    Maskinlesbar beskrivelse av APIet dokumentert i README.adoc.

    Spesifikasjonen er skrevet ut fra dokumentasjonen og kontrollert mot faktiske
    svar fra APIet. Den vedlikeholdes i dette repoet og er ikke publisert av Helfo.

    Merknader om oppførsel:

    * Felt uten verdi utelates normalt fra JSON-svaret (unntak: `bandasjister`,
      som returnerer `null`).
    * Ugyldige parameterverdier (f.eks. feil datoformat, eller en periode over
      13 måneder på månedsendepunktene) gir `200` med tomt svar (`{}`, eller en
      CSV med bare overskriftslinje), ikke en feilmelding.
    * Manglende obligatoriske parametre gir `400`.
    * Alle endepunkter unntatt eksportene støtter `Accept: application/json` og
      `Accept: application/xml`.
  license:
    name: Norsk lisens for offentlige data (NLOD)
    url: https://data.norge.no/nlod/no
externalDocs:
  description: README.adoc
  url: https://github.com/studentpack-aloumar/helserefusjon-apne-data/blob/main/README.adoc
servers:
  - url: https://opne-data-api.helserefusjon.no/v1
tags:
  - name: Kodeverk
  - name: Takstbruk
    description: |
      Aggregert takstbruk. Geografisk inndeling er basert på behandlers adresse.
      Kommune/år inneholder bare takster med antall større enn 5. Kommune/måned
      er begrenset til kommuner med over 10 000 innbyggere.
  - name: Samhandlere

paths:
  /takstkoder:
    get:
      tags: [Kodeverk]
      operationId: hentTakstkoder
      summary: Takstkoder
      parameters:
        - name: fagomraade
          in: query
          description: Fagområdekode, se `/fagomraader`.
          schema: {type: string, examples: [LE]}
        - $ref: '#/components/parameters/gyldigdato'
        - name: takstkode
          in: query
          description: Filtrer på takstkode. `%` (URL-kodet `%25`) gir jokertegnsøk.
          schema: {type: string, examples: [2ad]}
        - name: beskrivelse
          in: query
          description: Filtrer på beskrivelse. `%` (URL-kodet `%25`) gir jokertegnsøk.
          schema: {type: string, examples: ['%undersøkelse%']}
        - name: offisielle_ugyldige_takstkombinasjoner
          in: query
          description: |
            Filtrer offisielle ugyldige takstkombinasjoner i feltet
            `ugyldig_kombinasjon`. Om alt filtreres endres «Alle unntatt» til «Alle».
          schema: {type: string, enum: [ja, nei]}
      responses:
        '200':
          description: Takstkoder
          content:
            application/json:
              schema:
                type: object
                properties:
                  takstkoder:
                    type: array
                    items: {$ref: '#/components/schemas/Takstkode'}
            application/xml: {}

  /nlkkoder:
    get:
      tags: [Kodeverk]
      operationId: hentNlkKoder
      summary: Laboratoriekodeverk (NLK-koder)
      parameters:
        - $ref: '#/components/parameters/gyldigdato'
        - name: nlkkode
          in: query
          description: Filtrer på NLK-kode. `%` (URL-kodet `%25`) gir jokertegnsøk.
          schema: {type: string, examples: [NOR35342]}
        - $ref: '#/components/parameters/samhandlertype'
      responses:
        '200':
          description: NLK-koder
          content:
            application/json:
              schema:
                type: object
                properties:
                  nlkkoder:
                    type: array
                    items: {$ref: '#/components/schemas/NlkKode'}
            application/xml: {}

  /refusjonskategorisatser:
    get:
      tags: [Kodeverk]
      operationId: hentRefusjonskategorisatser
      summary: Refusjonskategorier for NLK, NCRP og patologi
      parameters:
        - $ref: '#/components/parameters/gyldigdato'
        - $ref: '#/components/parameters/samhandlertype'
      responses:
        '200':
          description: Refusjonskategorisatser
          content:
            application/json:
              schema:
                type: object
                properties:
                  refusjonskategorisatser:
                    type: array
                    items: {$ref: '#/components/schemas/Refusjonskategorisats'}
            application/xml: {}

  /apatkombinasjoner:
    get:
      tags: [Kodeverk]
      operationId: hentApatKombinasjoner
      summary: Apat-kombinasjoner
      parameters:
        - $ref: '#/components/parameters/gyldigdato'
        - $ref: '#/components/parameters/samhandlertype'
      responses:
        '200':
          description: Apat-kombinasjoner
          content:
            application/json:
              schema:
                type: object
                properties:
                  apatKombinasjoner:
                    type: array
                    items: {$ref: '#/components/schemas/ApatKombinasjon'}
            application/xml: {}

  /fagomraader:
    get:
      tags: [Kodeverk]
      operationId: hentFagomraader
      summary: Fagområder med tilhørende praksistyper
      responses:
        '200':
          description: Fagområder
          content:
            application/json:
              schema:
                type: object
                properties:
                  fagomraader:
                    type: array
                    items: {$ref: '#/components/schemas/Fagomraade'}
            application/xml: {}

  /bandasjister:
    get:
      tags: [Samhandlere]
      operationId: hentBandasjister
      summary: Bandasjister med direkte oppgjørsavtale
      description: |
        Siste gjeldende oversikt over bandasjister registrert med direkte
        oppgjørsavtale i Helfos samhandlerregister (SAR).
      responses:
        '200':
          description: Bandasjister
          content:
            application/json:
              schema:
                type: object
                properties:
                  bandasjister:
                    type: array
                    items: {$ref: '#/components/schemas/Bandasjist'}
            application/xml: {}

  # --- Aggregert takstbruk: JSON/XML ---------------------------------------
  /takstbruk/agtakst/kommune/maned:
